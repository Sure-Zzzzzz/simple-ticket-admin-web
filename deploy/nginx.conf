worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $ticket_cache_control {
    default "no-store";
    ~*\.(js|css|woff2?|svg|png)$ "public, max-age=31536000, immutable";
  }
  map $http_x_forwarded_host $ticket_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
  }
  map $http_x_forwarded_proto $ticket_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  server {
    listen 80;
    # 子应用入口与静态资源；Portal 注册使用 /app/ticket/index.html。
    location ^~ /app/ticket/ {
      alias /www/ticket/;
      try_files $uri $uri/ /app/ticket/index.html;
      add_header Cache-Control $ticket_cache_control;
    }
    # 工单 Nginx 自己接住公共 API，再转给内部 Server；IAM 入口不直连业务 Server。
    location ^~ /api/ticket/ {
      proxy_pass http://ticket-server:8395;
      proxy_http_version 1.1;
      proxy_set_header Host $ticket_forwarded_host;
      proxy_set_header X-Forwarded-Host $ticket_forwarded_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $ticket_forwarded_proto;
    }
    # 独立直开健康探针
    location = /healthz { return 200 'ok'; }
    location / {
      return 404;
    }
  }
}
